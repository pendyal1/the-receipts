[project]
name = "the-receipts"
version = "0.1.0"
description = "Historical financial investigations with auditable multi-agent research"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "google-auth>=2.38,<3",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
