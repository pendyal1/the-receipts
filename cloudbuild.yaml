steps:
  - name: node:22-slim
    entrypoint: node
    args: ['--test', 'tests/company-directory.test.cjs']
  - name: python:3.12-slim
    entrypoint: sh
    args: ['-c', 'pip install --no-cache-dir uv==0.13.1 && uv sync --locked && uv run pytest -q']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/the-receipts:$COMMIT_SHA', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/the-receipts:$COMMIT_SHA']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - the-receipts
      - --image=us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/the-receipts:$COMMIT_SHA
      - --region=us-east1
      - --service-account=1027747864849-compute@developer.gserviceaccount.com
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GEMINI_MODEL=gemini-3.5-flash-lite,APP_COMMIT=$COMMIT_SHA
      - --timeout=300
      - --memory=1Gi
      - --cpu=1
      - --concurrency=8
      - --min-instances=0
      - --max-instances=1
      - --allow-unauthenticated
      - --quiet
images: ['us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/the-receipts:$COMMIT_SHA']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
